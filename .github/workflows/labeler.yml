#
# The workflow is used to automatically labels to a pull request.
#
# `.github/labeler.yml` is the file to define rules to label.
name: "Pull Request Labeler"

on:
  - pull_request

jobs:
  triage:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # ratchet:actions/checkout@v6.0.3
      - uses: actions/labeler@f27b608878404679385c85cfa523b85ccb86e213 # ratchet:actions/labeler@v6
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
