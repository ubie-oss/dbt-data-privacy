#
# The workflow is used to automatically labels to a pull request.
#
# `.github/labeler.yml` is the file to define rules to label.
name: "Pull Request Labeler"

on:
  - pull_request

jobs:
  triage:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
      - uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # ratchet:actions/labeler@v6
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
